name: Container

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "27 6 * * 1"
  workflow_dispatch:

jobs:
  version:
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      version: ${{ steps.read.outputs.version }}
      released: ${{ steps.tag.outputs.released }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read crate version
        id: read
        run: |
          version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "crate version is $version" >> "$GITHUB_STEP_SUMMARY"
      - name: Tag the release if this version is new
        id: tag
        run: |
          set -euo pipefail
          tag="v${{ steps.read.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "$tag already exists — publishing latest and sha only" >> "$GITHUB_STEP_SUMMARY"
          else
            git tag "$tag"
            git push origin "$tag"
            gh release create "$tag" --title "$tag" --generate-notes
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "released $tag" >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    needs: version

    if: |
      !cancelled() &&
      (needs.version.result == 'success' || needs.version.result == 'skipped')

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.released == 'true' }}
            type=raw,value=latest,enable=${{ github.ref_name == github.event.repository.default_branch }}
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=ref,event=pr
            type=sha,enable=${{ github.event_name == 'push' }}
      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.build.outputs.imageid }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
      - name: Upload scan results
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
