{{- if .Values.ingress.enabled }}
{{- $defaultPaths := list (dict "path" "/api/v1/github" "pathType" "Prefix") -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "github-actions-exporter.fullname" . }}
  namespace: {{ include "github-actions-exporter.namespace" . }}
  labels:
    {{- include "github-actions-exporter.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range (.paths | default $defaultPaths) }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "github-actions-exporter.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
