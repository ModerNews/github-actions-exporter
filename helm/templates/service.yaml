{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "github-actions-exporter.fullname" . }}
  namespace: {{ include "github-actions-exporter.namespace" . }}
  labels:
    {{- include "github-actions-exporter.labelsWith" (dict "context" . "extra" .Values.service.labels) | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: {{ .Values.service.portName }}
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.portName }}
      protocol: TCP
  selector:
    {{- include "github-actions-exporter.selectorLabels" . | nindent 4 }}
{{- end }}
