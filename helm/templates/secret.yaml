{{- if not .Values.webhookSecret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "github-actions-exporter.fullname" . }}
  namespace: {{ include "github-actions-exporter.namespace" . }}
  labels:
    {{- include "github-actions-exporter.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.webhookSecret.secretKey }}: {{ required "Set webhookSecret.value, or point webhookSecret.existingSecret at a Secret you manage" .Values.webhookSecret.value | b64enc | quote }}
{{- end }}
